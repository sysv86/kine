name: CI (Linux, Windows & macOS)

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  verify:
    name: Build, Test & Smoke (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (x86_64)
            os: ubuntu-latest
            features: "--features gpu"
          - name: Windows (x86_64)
            os: windows-latest
            features: "--features gpu"
          - name: macOS (Apple Silicon aarch64)
            os: macos-14
            features: "--features gpu"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install latest FFmpeg with AV1 and H.264 encoders (Linux)
        if: runner.os == 'Linux'
        run: |
          ./scripts/install-ffmpeg.sh
          echo "KINE_FFMPEG=$GITHUB_WORKSPACE/.tools/ffmpeg/bin/ffmpeg" >> "$GITHUB_ENV"

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Verify headless kine-cli & kine-session build WITHOUT Wayland/X11 headers
        run: |
          cargo check -p kine-session --all-targets
          cargo check -p kine-cli --all-targets

      - name: Install Linux X11/Wayland/Vulkan dev headers for Xilem Studio GUI
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libxcb1-dev libxkbcommon-dev libwayland-dev libvulkan-dev nasm

      - name: Check workspace formatting & compilation (portable CPU + Xilem Studio)
        run: cargo check --workspace --all-targets

      - name: Check workspace compilation with GPU backend (`wgpu` + `vello_gpu`)
        run: cargo check --workspace --all-targets ${{ matrix.features }}

      - name: Run full workspace unit & integration test suite (including kine-session, kine-cli, kine-studio)
        run: cargo test --workspace

      - name: Run headless Studio & CLI smoke verification
        shell: bash
        run: ./scripts/ci-smoke.sh
