name: CI (Linux, Windows & macOS)

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  verify:
    name: Build, Test & Smoke (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (x86_64)
            os: ubuntu-latest
            features: "--features gpu"
          - name: Windows (x86_64)
            os: windows-latest
            features: "--features gpu"
          - name: macOS (Apple Silicon aarch64)
            os: macos-14
            features: "--features gpu"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install latest FFmpeg with AV1 and H.264 encoders (Linux)
        if: runner.os == 'Linux'
        run: |
          ./scripts/install-ffmpeg.sh
          echo "KINE_FFMPEG=$GITHUB_WORKSPACE/.tools/ffmpeg/bin/ffmpeg" >> "$GITHUB_ENV"

      - name: Install FFmpeg with AV1 and H.264 encoders (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg
          echo "KINE_FFMPEG=$(command -v ffmpeg)" >> "$GITHUB_ENV"
          ffmpeg -hide_banner -encoders | grep -E 'libsvtav1|libaom-av1|libopenh264|libx264'

      - name: Install latest FFmpeg with AV1 and H.264 encoders (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip'
          $zip = Join-Path $env:RUNNER_TEMP 'ffmpeg.zip'
          $dir = Join-Path $env:RUNNER_TEMP 'ffmpeg'
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dir
          $ff = Get-ChildItem $dir -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          "KINE_FFMPEG=$($ff.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          & $ff.FullName -hide_banner -encoders | Select-String 'libsvtav1|libaom-av1|libopenh264|libx264'

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Verify headless kine-cli & kine-session build WITHOUT Wayland/X11 headers
        run: |
          cargo check -p kine-session --all-targets
          cargo check -p kine-cli --all-targets

      - name: Install Linux X11/Wayland/Vulkan dev headers for Xilem Studio GUI
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libxcb1-dev libxkbcommon-dev libwayland-dev libvulkan-dev nasm

      - name: Check workspace formatting & compilation (portable CPU + Xilem Studio)
        run: cargo check --workspace --all-targets

      - name: Check workspace compilation with GPU backend (`wgpu` + `vello_gpu`)
        run: cargo check --workspace --all-targets ${{ matrix.features }}

      - name: Run full workspace unit & integration test suite (including kine-session, kine-cli, kine-studio)
        run: cargo test --workspace

      - name: Run headless Studio & CLI smoke verification
        shell: bash
        run: ./scripts/ci-smoke.sh
