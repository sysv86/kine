[package]
name = "kine-studio"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Kine Studio — native Rust Xilem visual editor and NLE desktop UI over kine-session"

[lib]
name = "kine_studio"
path = "src/lib.rs"

[[bin]]
name = "kine-studio"
path = "src/main.rs"

[dependencies]
kine-core.workspace = true
kine-render.workspace = true
kine-server.workspace = true
kine-session.workspace = true
serde.workspace = true
serde_json.workspace = true
xilem = { workspace = true, optional = true }

[features]
default = ["xilem-ui", "gpu"]
# Native Xilem reactive desktop UI (Linux X11/Wayland, Windows DX12/Vulkan, macOS Metal).
xilem-ui = ["dep:xilem"]
# Forward GPU rasterization and hardware video encoding features to the in-process session/engine.
gpu = ["kine-session/gpu", "kine-server/gpu"]
hwencode = ["kine-session/hwencode", "kine-server/hwencode"]
zero-copy = ["kine-session/zero-copy", "kine-server/zero-copy"]
