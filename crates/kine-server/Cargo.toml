[package]
name = "kine-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
kine-core.workspace = true
kine-text.workspace = true
kine-render.workspace = true
kine-encode.workspace = true
kine-audio.workspace = true
kine-shader.workspace = true
kine-mux.workspace = true
kine-platform.workspace = true
kine-script.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
base64.workspace = true
image.workspace = true
taffy.workspace = true

[dependencies.wgpu]
workspace = true
optional = true

[dev-dependencies]

[features]
default = []
# Forward the GPU rasterization/effect path to the renderer.
gpu = ["kine-render/gpu", "dep:wgpu"]
# Hardware H.264 encode (Vulkan Video) as an alternative to the software AV1 path.
hwencode = ["kine-mux/hwencode"]
# The closed loop: one wgpu device shared by the rasterizer and the encoder, so a
# rendered texture reaches the encoder without touching host memory.
zero-copy = ["gpu", "hwencode"]
# Optional NASM assembly acceleration for rav1e software AV1 encoding.
asm = ["kine-encode/asm"]
