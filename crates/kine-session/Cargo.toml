[package]
name = "kine-session"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Headless session state, NLE timeline model, property inspector, live file watcher, and external CLI agent TCP bridge for Kine Studio"

[lib]
name = "kine_session"
path = "src/lib.rs"

[dependencies]
kine-core.workspace = true
kine-text.workspace = true
kine-shader.workspace = true
kine-encode.workspace = true
kine-audio.workspace = true
kine-render.workspace = true
kine-script.workspace = true
kine-mux.workspace = true
kine-platform.workspace = true
kine-server.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
base64.workspace = true
image.workspace = true
taffy.workspace = true

[features]
default = []
gpu = ["kine-server/gpu"]
hwencode = ["kine-server/hwencode"]
zero-copy = ["kine-server/zero-copy"]
