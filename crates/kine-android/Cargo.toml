[package]
name = "kine-android"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# The app loads this by this name: `System.loadLibrary("kine_bridge")` looks for
# `libkine_bridge.so`, so the crate name and the library name differ on purpose.
name = "kine_bridge"
crate-type = ["cdylib"]

[dependencies]
kine-core.workspace = true
kine-server.workspace = true
kine-script.workspace = true
serde.workspace = true
serde_json.workspace = true
jni = "0.21"

[features]
default = []
# Forwarded to the engine so the app can ask for the hardware encoder when the
# build carries one. The Android backend is MediaCodec, which is a different
# crate; these two stay for the desktop-shaped paths.
gpu = ["kine-server/gpu"]
hwencode = ["kine-server/hwencode"]
zero-copy = ["gpu", "hwencode"]
