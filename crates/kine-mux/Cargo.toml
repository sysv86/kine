[package]
name = "kine-mux"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
muxfin.workspace = true
thiserror.workspace = true
serde.workspace = true

[features]
default = []
# Hardware encode (Vulkan Video) plus the wgpu-texture input path.
hwencode = ["dep:gpu-video", "dep:wgpu", "dep:kine-encode", "dep:pollster"]

# `wgpu` is the feature the zero-copy texture path needs; the workspace entry
# already selects it (with default features off).
[dependencies.gpu-video]
workspace = true
optional = true

# The same wgpu the rasterizer uses — gpu-video is taken from upstream master
# precisely so this is one crate, not two majors side by side.
[dependencies.wgpu]
workspace = true
optional = true

[dependencies.pollster]
workspace = true
optional = true

[dependencies.kine-encode]
workspace = true
optional = true
