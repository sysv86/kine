[workspace]
resolver = "2"
members = [
    "crates/kine-core",
    "crates/kine-text",
    "crates/kine-shader",
    "crates/kine-encode",
    "crates/kine-audio",
    "crates/kine-render",
    "crates/kine-script",
    "crates/kine-mux",
    "crates/kine-platform",
    "crates/kine-server",
    "crates/kine-session",
    "crates/kine-studio",
    "crates/kine-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/sysv86/kine"
rust-version = "1.98"

[workspace.dependencies]
kine-core = { path = "crates/kine-core" }
kine-text = { path = "crates/kine-text" }
kine-shader = { path = "crates/kine-shader" }
kine-encode = { path = "crates/kine-encode" }
kine-audio = { path = "crates/kine-audio" }
kine-render = { path = "crates/kine-render" }
kine-script = { path = "crates/kine-script" }
kine-mux = { path = "crates/kine-mux" }
kine-platform = { path = "crates/kine-platform" }
kine-server = { path = "crates/kine-server" }
kine-session = { path = "crates/kine-session" }
kine-studio = { path = "crates/kine-studio" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

taffy = { version = "0.14", features = ["serde"] }
cosmic-text = "0.19"
vello = "0.11"
vello_gpu = "0.3"
wgpu = "30"
naga = { version = "30", features = ["wgsl-in"] }
pollster = "0.4"
flacenc = "0.5"
symphonia = { version = "0.6", features = ["all"] }
rubato = "5"
hound = "3.5"
vello_cpu = "0.3"
rquickjs = { version = "0.14", features = ["macro"] }
oxc = "0.153"
muxfin = "0.5"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
xilem = "0.4.0"
